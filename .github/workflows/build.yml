name: Build Frida kernel module
run-name: Frida ${{ inputs.frida_version }} • ${{ inputs.kernel_release }}

on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: 'Complete uname -r output (must match the prepared kernel)'
        required: true
        type: string
        default: '6.1.145-android14-11-gc1de4747ac59-ab14219743'
      kernel_family:
        description: 'Kernel family (auto detects and checks kernel_release)'
        type: choice
        default: auto
        options:
          - auto
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
          - custom
      frida_version:
        description: 'Frida release used for source, GumJS, and server'
        required: true
        type: string
        default: '17.26.2'
      kernel_repository:
        description: 'Kernel source Git repository (HTTPS)'
        required: true
        type: string
        default: 'https://android.googlesource.com/kernel/common'
      kernel_ref:
        description: 'Source commit or tag (empty: infer -gCOMMIT from uname -r)'
        type: string
      android_ci_build:
        description: 'Android CI build ID (empty: infer -abBUILD from uname -r)'
        type: string
      android_ci_target:
        description: 'Android CI target'
        type: string
        default: kernel_aarch64
      prepare_url:
        description: 'Custom prepared-kernel tar URL (set together with symvers_url)'
        type: string
      symvers_url:
        description: 'Custom Module.symvers URL from the same kernel build'
        type: string
      kernel_image_url:
        description: 'Optional original Image or Image.lz4 URL when prepared artifacts expired'
        type: string
      kernel_config_sha256:
        description: 'SHA256 of decompressed /proc/config.gz; required with kernel_image_url'
        type: string
      system_map_url:
        description: 'Original System.map URL for Linux 5.10 GKI with trimmed kprobe exports'
        type: string
      kernel_clang_url:
        description: 'auto: Android compiler from .config; system: LLVM 19; or tar URL'
        type: string
        default: auto
      rust_toolchain:
        description: 'Rust toolchain for the Frida agent'
        type: string
        default: '1.99.1'
      module_name:
        description: 'Output module name, without .ko'
        type: string
        default: frida-agent
      include_server:
        description: 'Include the matching Android arm64 frida-server in the artifact'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FRIDA_VERSION: ${{ inputs.frida_version }}
      KERNEL_RELEASE: ${{ inputs.kernel_release }}
      KERNEL_FAMILY: ${{ inputs.kernel_family }}
      KERNEL_REPOSITORY: ${{ inputs.kernel_repository }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      ANDROID_CI_BUILD: ${{ inputs.android_ci_build }}
      ANDROID_CI_TARGET: ${{ inputs.android_ci_target }}
      PREPARE_URL: ${{ inputs.prepare_url }}
      SYMVERS_URL: ${{ inputs.symvers_url }}
      KERNEL_IMAGE_URL: ${{ inputs.kernel_image_url }}
      KERNEL_CONFIG_SHA256: ${{ inputs.kernel_config_sha256 }}
      SYSTEM_MAP_URL: ${{ inputs.system_map_url }}
      KERNEL_CLANG_URL: ${{ inputs.kernel_clang_url }}
      RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
      MODULE_NAME: ${{ inputs.module_name }}
      INCLUDE_SERVER: ${{ inputs.include_server }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate inputs
        id: config
        run: python3 scripts/build.py configure
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/apt-cache
          key: ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ hashFiles('scripts/apt-packages.txt') }}-${{ steps.config.outputs.cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ hashFiles('scripts/apt-packages.txt') }}-
      - name: Restore source and download cache
        id: environment-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .work/download-cache
            .work/kernel-source/.git
            .work/sdk
          key: ${{ runner.os }}-${{ runner.arch }}-environment-v1-${{ steps.config.outputs.environment_cache_key }}
      - name: Restore Rust and Cargo cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ inputs.rust_toolchain }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-v1-${{ inputs.rust_toolchain }}-${{ inputs.frida_version }}-${{ steps.config.outputs.cache_epoch }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-v1-${{ inputs.rust_toolchain }}-${{ inputs.frida_version }}-
      - name: Install build dependencies
        id: apt
        shell: bash
        run: |
          mkdir -p .work/apt-cache/partial
          mapfile -t packages < scripts/apt-packages.txt
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.work/apt-cache" \
            -o Binary::apt-get::APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends "${packages[@]}"
          sudo chown -R "$(id -u):$(id -g)" .work/apt-cache
      - name: Save apt package cache
        if: ${{ !cancelled() && steps.apt.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Download matching sources and kernel artifacts
        id: prepare
        run: |
          set -o pipefail
          python3 scripts/build.py prepare 2>&1 | tee .work/prepare.log
      - name: Save source and download cache
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.environment-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .work/download-cache
            .work/kernel-source/.git
            .work/sdk
          key: ${{ steps.environment-cache.outputs.cache-primary-key }}
      - name: Build frida-agent.ko
        id: compile
        run: |
          set -o pipefail
          python3 scripts/build.py build 2>&1 | tee .work/build.log
      - name: Validate and package output
        run: python3 scripts/build.py package
      - name: Upload module bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/*.json
            .work/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Rust and Cargo cache
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ inputs.rust_toolchain }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
