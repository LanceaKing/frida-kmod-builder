name: Check build scripts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/*.py tests/device/*.py
      - run: npm ci --prefix tests/device
      - run: |
          for script in tests/device/*.js; do node --check "$script"; done
          node --check tests/device/node_modules/frida-java-bridge/index.js
          node --check tests/device/node_modules/frida-java-bridge/lib/android.js
          node --check tests/device/node_modules/frida-java-bridge/lib/class-factory.js
          node --check tests/device/node_modules/frida-java-bridge/lib/vm.js
          node --check tests/device/node_modules/frida-java-bridge/lib/env.js
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - run: npm install --global npm@11.19.1
      - run: |
          python3 -m venv .work/tools-venv
          .work/tools-venv/bin/pip install uv==0.13.0
          PATH="$PWD/.work/tools-venv/bin:$PATH" .work/tools-venv/bin/python scripts/build_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tools-${{ github.run_id }}
          path: dist/tools/
          if-no-files-found: error
