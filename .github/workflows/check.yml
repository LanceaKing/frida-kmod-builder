name: Check build scripts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/build.py tests/device/app-session.py tests/device/app-exit-race.py
      - run: cc -Wall -Wextra -Werror -fsyntax-only tests/device/exit-on-injection.c
